                                <select name="assignee" class="form-select shadow-sm">
                                    <option th:each="a : ${assignees}" th:value="${a}" th:text="${a.toUpperCase()}" th:selected="${a == currentUser}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">

                                <div class="dropdown">
                                    <button class="btn btn-outline-secondary btn-sm w-100 text-start d-flex justify-content-between align-items-center bg-white shadow-sm" type="button" data-bs-toggle="dropdown" style="height: 38px; border-color: #dee2e6;">

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/vn.js"></script>
    <script src="https://unpkg.com/tributejs@5.1.3/dist/tribute.min.js"></script>

    <script>
        // INIT FLATPICKR
        flatpickr("#reportDueDate", {
            enableTime: true,
            time_24hr: true,
            minDate: "today",
            locale: "vn",
            dateFormat: "Y-m-d H:i",
            altInput: true,
            altFormat: "H:i d/m/Y"
        });

        // VIEW TOGGLE LOGIC
        document.getElementById('mobile-toggle-btn').addEventListener('click', function() {
            document.getElementById('main-content').classList.toggle('expanded');
        });

        // TOGGLE STATUS BAND IN LIST VIEW
        function toggleStatusBand(bandId) {
            const rows = document.querySelectorAll('.band-row-' + bandId);
            const icon = document.getElementById('band-icon-' + bandId);
            let isHidden = false;
            rows.forEach(r => {
                if(r.style.display === 'none') {
                    if(!r.classList.contains('subtask-tree-row')) {
                        r.style.display = 'table-row';
                    }
                } else {
                    r.style.display = 'none';
                    isHidden = true;
                }
            });
            if(icon) {
                if(isHidden) icon.style.transform = 'rotate(-90deg)';
                else icon.style.transform = 'rotate(0deg)';
            }
        }

        // TOGGLE SUBTASK TREE
        function toggleSubtaskTree(reportId) {
            const rows = document.querySelectorAll('.subtask-of-' + reportId);
            const icon = document.getElementById('icon-subtask-' + reportId);
            let isExpanded = false;
            rows.forEach(r => {
                if (r.style.display === 'none' || r.style.display === '') {
                    r.style.display = 'table-row';
                    isExpanded = true;
                } else {
                    r.style.display = 'none';
                }
            });
            if (icon) {
                if (isExpanded) icon.style.transform = 'rotate(90deg)';
                else icon.style.transform = 'rotate(0deg)';
            }
        }

        function addSubTaskInline(reportId, title) {
            if (!title || title.trim() === '') return;
            const formData = new URLSearchParams();
            formData.append('workReportId', reportId);
            formData.append('title', title.trim());
            formData.append('completed', 'false');

            fetch('/work-reports/subtasks/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            }).then(res => {
                location.reload();
            });
        }

        function toggleSubTaskStatus(subtaskId, isCompleted) {
            const formData = new URLSearchParams();
            formData.append('id', subtaskId);
            formData.append('completed', isCompleted);

            fetch('/work-reports/subtasks/toggle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            }).then(res => {
                location.reload();
            });
        }

        function deleteSubTaskItem(subtaskId, parentReportId) {
            if(!confirm('Xóa việc con này?')) return;
            fetch('/work-reports/subtasks/delete/' + subtaskId, {
                method: 'POST'
            }).then(res => {
                location.reload();
            });
        }

        function openUpdateModalFromBtn(btn) {
            const id = btn.getAttribute('data-id');
            const progress = btn.getAttribute('data-progress');
            const status = btn.getAttribute('data-status');
            const note = btn.getAttribute('data-note');
            const title = btn.getAttribute('data-title');
            const watchers = btn.getAttribute('data-watchers');
            
            document.getElementById('updateReportId').value = id;
            document.getElementById('updateTaskTitle').innerText = title || ('Nhiệm vụ #' + id);
            
            const pRange = document.getElementById('updateProgressRange');
            if (pRange) {
                pRange.value = progress;
                document.getElementById('updateProgressVal').innerText = progress + '%';
            }
            
            const sel = document.getElementById('updateStatusSelect');
            if (sel) sel.value = status || 'PLANNING';
            
            const tArea = document.getElementById('updateReportNote');
            if (tArea) tArea.value = note || '';

            const wInput = document.getElementById('updateReportWatchers');
            if (wInput) wInput.value = watchers || '';

            const modalEl = document.getElementById('updateReportModal');
            const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
            modal.show();
        }

        function openQuickCreateModal(band) {
            const createModalEl = document.getElementById('createReportModal');
            const statusSelect = createModalEl.querySelector('select[name="status"]');
            if (statusSelect) statusSelect.value = band;
            const modal = bootstrap.Modal.getInstance(createModalEl) || new bootstrap.Modal(createModalEl);
            modal.show();
        }

        // INLINE EDITING FUNCTIONS
        function openInlineAssignModal(id, assignee, watchers) {
            document.getElementById('inlineAssignReportId').value = id;
            const sel = document.getElementById('inlineAssigneeSelect');
            if (sel) sel.value = assignee || '';
            document.getElementById('inlineWatchersInput').value = watchers && watchers !== 'null' ? watchers : '';
            const modalEl = document.getElementById('inlineAssignModal');
            const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
            modal.show();
        }

        function openInlineAssignModalFromEl(el) {
            const id = el.getAttribute('data-id');
            const assignee = el.getAttribute('data-assignee') || '';
            const watchers = el.getAttribute('data-watchers') || '';
            openInlineAssignModal(id, assignee, watchers);
        }

        function saveInlineAssign() {
            const id = document.getElementById('inlineAssignReportId').value;
            const assignee = document.getElementById('inlineAssigneeSelect').value;
            const watchers = document.getElementById('inlineWatchersInput').value;
            const formData = new URLSearchParams();
            formData.append('id', id);
            formData.append('assignee', assignee);
            formData.append('watchers', watchers);

            fetch('/work-reports/update-inline', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            })
            .then(res => res.text())
            .then(data => {
                if (data === 'success') location.reload();
                else alert('Lỗi khi cập nhật phân công!');
            });
        }

        function openInlineStatusModal(id, status) {
            document.getElementById('inlineStatusReportId').value = id;
            const modalEl = document.getElementById('inlineStatusModal');
            const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
            modal.show();
        }

        function openInlineStatusModalFromEl(el) {
            const id = el.getAttribute('data-id');
            const status = el.getAttribute('data-status') || 'PLANNING';
            openInlineStatusModal(id, status);
        }

        function saveInlineStatus(status) {
            const id = document.getElementById('inlineStatusReportId').value;
            const formData = new URLSearchParams();
            formData.append('id', id);
            formData.append('status', status);

            fetch('/work-reports/update-inline', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            })
            .then(res => res.text())
            .then(data => {
                if (data === 'success') location.reload();
                else alert('Lỗi khi cập nhật trạng thái!');
            });
        }

        function openInlineDateModal(id) {
            document.getElementById('inlineDateReportId').value = id;
            const pickerEl = document.getElementById('inlineDatePicker');
            if (pickerEl && !pickerEl._flatpickr) {
                flatpickr(pickerEl, {
                    enableTime: true, time_24hr: true, minDate: "today", locale: "vn",
                    dateFormat: "Y-m-d H:i", altInput: true, altFormat: "H:i d/m/Y"
                });
            }
            const modalEl = document.getElementById('inlineDateModal');
            const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
            modal.show();
        }

        function saveInlineDate() {
            const id = document.getElementById('inlineDateReportId').value;
            const dateStr = document.getElementById('inlineDatePicker').value;
            if (!dateStr) return;
            const formData = new URLSearchParams();
            formData.append('id', id);
            formData.append('dueDate', dateStr);

            fetch('/work-reports/update-inline', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            })
            .then(res => res.text())
            .then(data => {
                if (data === 'success') location.reload();
                else alert('Lỗi khi cập nhật hạn chót!');
            });
        }

        // TASK DETAIL MODAL & COMMENTS
        let currentDetailReportId = null;
        function openTaskDetailModal(id) {
            currentDetailReportId = id;
            fetch('/work-reports/detail/' + id)
            .then(res => res.json())
            .then(data => {
                if (!data.report) { alert('Không tìm thấy thông tin tác vụ!'); return; }
                const r = data.report;
                document.getElementById('detailTaskTitle').innerText = r.taskTitle;
                document.getElementById('detailProjectName').innerText = r.projectName || '--';
                document.getElementById('detailAssignee').innerText = r.assignee ? r.assignee.toUpperCase() : '--';
                if (r.dueDate) {
                    const dt = new Date(r.dueDate);
                    document.getElementById('detailDueDate').innerText = dt.toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit', year: 'numeric' });
                } else {
                    document.getElementById('detailDueDate').innerText = '-- Chưa đặt --';
                }
                document.getElementById('detailDailyReport').innerText = r.dailyReport && r.dailyReport.trim() !== '' ? r.dailyReport : 'Chưa có ghi chú báo cáo...';
                
                const badge = document.getElementById('detailStatusBadge');
                if (badge) {
                    badge.className = 'status-badge m-0 ' + (r.status === 'PLANNING' ? 'status-planning' : (r.status === 'PROGRESS' ? 'status-progress' : (r.status == 'TESTING' ? 'status-testing' : 'status-completed')));
                    badge.innerHTML = '<i class="fa-solid ' + (r.status === 'PLANNING' ? 'fa-lightbulb' : (r.status === 'PROGRESS' ? 'fa-spinner fa-spin' : (r.status == 'TESTING' ? 'fa-vial' : 'fa-check'))) + '"></i> ' + (r.status === 'PLANNING' ? 'TO DO' : (r.status === 'PROGRESS' ? 'IN PROGRESS' : (r.status === 'TESTING' ? 'TESTING' : 'DONE')));
                }

                // Render Subtasks
                const subListEl = document.getElementById('detailSubtaskList');
                const subtasks = data.subtasks || [];
                document.getElementById('detailSubtaskCount').innerText = subtasks.length;
                subListEl.innerHTML = '';
                subtasks.forEach(st => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'd-flex align-items-center justify-content-between p-2 bg-white border rounded-3';
                    itemDiv.innerHTML = `
                        <div class="d-flex align-items-center gap-2">
                            <input type="checkbox" class="form-check-input m-0 cursor-pointer" ${st.completed ? 'checked' : ''} onchange="toggleSubTaskStatus(${st.id}, this.checked)">
                            <span class="small fw-medium ${st.completed ? 'text-decoration-line-through text-muted' : ''}">${st.title}</span>
                        </div>
                        <span class="badge bg-light text-dark border small">${st.assignee || 'Assignee'}</span>
                    `;
                    subListEl.appendChild(itemDiv);
                });

                // Render Comments
                renderCommentsList(data.comments || []);

                // Show modal
                const modalEl = document.getElementById('taskDetailModal');
                const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
                modal.show();
            })
            .catch(err => {
                console.error(err);
                alert('Lỗi kết nối khi tải chi tiết tác vụ!');
            });
        }

        function renderCommentsList(comments) {
            const feedEl = document.getElementById('detailCommentsFeed');
            if (!comments || comments.length === 0) {
                feedEl.innerHTML = '<div class="text-center py-5 text-muted small"><i class="fa-regular fa-comments fs-3 d-block mb-2"></i>Chưa có thảo luận nào. Hãy là người bắt đầu cuộc trò chuyện!</div>';
                return;
            }
            feedEl.innerHTML = '';
            comments.forEach(c => {
                const bubble = document.createElement('div');
                bubble.className = 'comment-bubble';
                const timeStr = c.createdAt ? new Date(c.createdAt).toLocaleString('vi-VN') : 'Vừa xong';
                // highlight @mentions in content
                let formattedContent = (c.content || '').replace(/@(\w+)/g, '<span class="mention-tag">@$1</span>');
                bubble.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <strong class="text-primary small"><i class="fa-solid fa-user-circle me-1"></i>${c.author || 'Anonymous'}</strong>
                        <span class="text-muted" style="font-size: 11px;">${timeStr}</span>
                    </div>
                    <div class="small text-dark mt-1">${formattedContent}</div>
                `;
                feedEl.appendChild(bubble);
            });
            feedEl.scrollTop = feedEl.scrollHeight;
        }

        function sendTaskComment() {
            if (!currentDetailReportId) return;
            const inputEl = document.getElementById('detailNewCommentText');
            const content = inputEl.value;
            if (!content || !content.trim()) return;

            const formData = new URLSearchParams();
            formData.append('workReportId', currentDetailReportId);
            formData.append('content', content.trim());

            fetch('/work-reports/comments/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            })
            .then(res => res.json())
            .then(newComment => {
                inputEl.value = '';
                // Reload detail to update feed
                fetch('/work-reports/detail/' + currentDetailReportId)
                .then(res => res.json())
                .then(data => { renderCommentsList(data.comments || []); });
            })
            .catch(err => {
                console.error(err);
                alert('Lỗi!');
            });
        }

        function quickCreateTask(title, status) {
            if (!title || !title.trim()) return;
            const formData = new URLSearchParams();
            formData.append('taskTitle', title.trim());
            formData.append('status', status);
            formData.append('projectName', 'Helpdesk v2');
            formData.append('assignee', '');
            
            fetch('/work-reports/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            })
            .then(res => { location.reload(); })
            .catch(err => { console.error(err); alert('Lỗi khi tạo nhiệm vụ mới!'); });
        }

        document.addEventListener('DOMContentLoaded', function() {
            const detailSubInput = document.getElementById('detailNewSubtaskInput');
            if (detailSubInput) {
                detailSubInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        if (currentDetailReportId && this.value.trim()) {
                            addSubTaskInline(currentDetailReportId, this.value.trim());
                        }
                    }
                });
            }

            // @MENTION AUTOCOMPLETE LOGIC WITH TRIBUTE.JS
            const allUserNames = [
                <th:block th:each="u, stat : ${assignees}">
                    { key: '<th:block th:text="${u}"></th:block>', value: '<th:block th:text="${u}"></th:block>' }<th:block th:if="${!stat.last}">,</th:block>
                </th:block>
            ];
            if (allUserNames.length === 0) {
                allUserNames.push({key:'tin', value:'tin'}, {key:'trinh', value:'trinh'}, {key:'dinh', value:'dinh'}, {key:'admin', value:'admin'}, {key:'support', value:'support'}, {key:'manager', value:'manager'});
            }
            
            if (typeof Tribute !== 'undefined') {
                const tribute = new Tribute({
                    values: allUserNames,
                    selectTemplate: function(item) {
                        return '@' + item.original.value;
                    },
                    menuItemTemplate: function (item) {
                        return '<div class="mention-item" style="padding: 5px 10px; display: flex; align-items: center; gap: 10px;"><div class="mention-avatar" style="width: 24px; height: 24px; border-radius: 50%; background: #4f46e5; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 11px;">' + item.original.value.substring(0, 1).toUpperCase() + '</div><span class="fw-bold small text-dark">@' + item.original.value + '</span></div>';
                    }
                });
                
                const commentInput = document.getElementById('detailNewCommentText');
                if (commentInput) tribute.attach(commentInput);
                
                const noteInput = document.getElementById('updateReportNote');
                if (noteInput) tribute.attach(noteInput);
                
                const watchersInput = document.getElementById('inlineWatchersInput');
                if (watchersInput) tribute.attach(watchersInput);
                
                const updateWatchersInput = document.getElementById('updateReportWatchers');
                if (updateWatchersInput) tribute.attach(updateWatchersInput);
            }
        });
    </script>
</body>
</html>
