spring.application.name=helpdesk
server.port=${SERVER_PORT:8080}

# Mac dinh chay profile "local": doc them application-local.properties (khong day len git,
# chua secret cua may dev). Tren server dat SPRING_PROFILES_ACTIVE=prod va cap secret qua bien moi truong.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Dia chi that cua he thong (dung cho link trong email gui di)
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Chay sau reverse proxy (Traefik) thi phai doc header X-Forwarded-*,
# neu khong link OAuth2 cua Microsoft se sinh ra http noi bo va bi tu choi.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# ===== Datasource (MySQL) =====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:helpdesk}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== Noi luu file dinh kem =====
# local -> luu xuong o dia (dev) | s3 -> luu len MinIO (production)
app.storage.type=${STORAGE_TYPE:local}
app.storage.local.dir=${STORAGE_LOCAL_DIR:src/main/resources/static/uploads}
# Endpoint phai la URL day du co http:// hoac https://
app.storage.s3.endpoint=${MINIO_PUBLIC_URL:}
app.storage.s3.bucket=${MINIO_BUCKET:}
app.storage.s3.access-key=${MINIO_ACCESS_KEY:}
app.storage.s3.secret-key=${MINIO_SECRET_KEY:}
# MinIO khong dung region nhung AWS SDK bat buoc phai co mot gia tri
app.storage.s3.region=${MINIO_REGION:us-east-1}
# MinIO dung path-style: https://host/bucket/file
app.storage.s3.path-style-access=${MINIO_PATH_STYLE:true}

# ===== Seed du lieu ban dau (DataSeeder tu chay moi lan khoi dong) =====
# Tao tai khoan admin neu chua co. Production BAT BUOC dat mat khau rieng.
app.seed.admin-password=${SEED_ADMIN_PASSWORD:admin123}
# Tai khoan "user"/"user123" chi de thu nghiem, production dat false
app.seed.demo-user=${SEED_DEMO_USER:true}

# Gioi han dung luong file upload (anh chup dien thoai thuong 3-8MB)
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:25MB}

# ===== Giao dien =====
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ===== Flyway: quan ly thay doi cau truc DB =====
# Moi thay doi schema deu phai viet 1 file SQL moi trong db/migration (V2__, V3__...).
# KHONG de Hibernate tu sua DB - de lich su thay doi luon nam trong git.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
# DB da co san bang (import tu dump cu) thi danh dau V1 la da chay, khong chay lai
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Cuu ho khi checksum lech (file migration da chay bi sua noi dung).
# Bat FLYWAY_REPAIR=true DUNG 1 lan deploy cho Flyway ghi lai checksum, xong TAT lai ngay.
# De bat thuong xuyen se che mat loi sua nham file migration da chay.
app.flyway.repair-before-migrate=${FLYWAY_REPAIR:false}

# ===== JPA / Hibernate =====
# validate: chi kiem tra bang co khop voi entity khong, khong tu sua DB.
# Flyway lo phan tao/sua bang nen KHONG dat thanh update tru khi that su can.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
logging.level.org.springframework.transaction=${LOG_LEVEL_TRANSACTION:DEBUG}
logging.level.org.hibernate.resource.transaction=${LOG_LEVEL_HIBERNATE:DEBUG}

# ===== OAuth2 Microsoft Entra ID =====
spring.security.oauth2.client.registration.microsoft.client-id=${AZURE_CLIENT_ID:}
spring.security.oauth2.client.registration.microsoft.client-secret=${AZURE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email,offline_access,Mail.Read
spring.security.oauth2.client.registration.microsoft.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.microsoft.client-name=Microsoft 365

spring.security.oauth2.client.provider.microsoft.issuer-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID:}/v2.0
spring.security.oauth2.client.provider.microsoft.user-name-attribute=name

# ===== Microsoft Graph API (gui email) =====
azure.graph.client-id=${AZURE_CLIENT_ID:}
azure.graph.tenant-id=${AZURE_TENANT_ID:}
azure.graph.client-secret=${AZURE_CLIENT_SECRET:}
azure.graph.sender-email=${AZURE_SENDER_EMAIL:it01@midomax.vn}

# ===== Encoding =====
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# ===== Healthcheck cho Dokploy =====
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
