<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Midomax IT System</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 45%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            color: #0f172a;
        }

        /* Interactive Particle Background */
        #brandCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Ambient Glow Waves */
        .brand-glow {
            position: fixed;
            width: 700px;
            height: 700px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(220, 38, 38, 0.15) 0%, rgba(30, 58, 138, 0.25) 50%, transparent 70%);
            z-index: 2;
            pointer-events: none;
            animation: pulseGlow 10s ease-in-out infinite alternate;
        }
        .glow-1 { top: -250px; left: -250px; }
        .glow-2 { bottom: -250px; right: -250px; background: radial-gradient(circle, rgba(37, 99, 235, 0.25) 0%, transparent 70%); }

        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.7; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        /* STAGE CONTAINER */
        .login-stage {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 30px 20px;
        }

        /* MIDOMAX BRAND CARD SHELL */
        .brand-card-shell {
            position: relative;
            width: 100%;
            animation: cardFloat 6s ease-in-out infinite alternate;
        }

        @keyframes cardFloat {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-8px); }
        }

        /* MIDOMAX Signature Blue & Red Side Extension Pills */
        .side-pill {
            position: absolute;
            border-radius: 30px;
            z-index: 2;
            pointer-events: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }
        .pill-r1 { right: -22px; top: 40px; width: 70px; height: 26px; background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%); }
        .pill-r2 { right: -34px; top: 82px; width: 90px; height: 30px; background: #ffffff; }
        .pill-r3 { right: -24px; bottom: 60px; width: 75px; height: 26px; background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%); }
        .pill-r4 { right: -36px; bottom: 22px; width: 95px; height: 32px; background: #ffffff; }

        .pill-l1 { left: -26px; top: 85px; width: 80px; height: 28px; background: #ffffff; }
        .pill-l2 { left: -20px; top: 170px; width: 60px; height: 24px; background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%); }

        /* MAIN PRISTINE WHITE LUXURY CARD CONTAINER */
        .main-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 42px 36px 36px;
            box-shadow: 0 30px 70px rgba(15, 23, 42, 0.35);
            position: relative;
            z-index: 5;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* Top MIDOMAX Accent Bar */
        .main-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20%;
            right: 20%;
            height: 4px;
            background: linear-gradient(90deg, #dc2626, #1e3a8a);
            border-radius: 4px;
            box-shadow: 0 2px 10px rgba(220, 38, 38, 0.4);
        }

        /* Brand Typography & Logo Styling */
        .brand-header {
            margin-bottom: 22px;
        }

        /* brand.midomax & brand.kamito morphing container */
        .brand-morph-container {
            display: inline-grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
            align-items: center;
            justify-items: center;
            position: relative;
            width: 100%;
            margin-bottom: 2px;
        }

        .brand-face {
            grid-area: 1 / 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            backface-visibility: hidden;
        }        .brand-face-midomax {
            animation: brandSlowZoomMidomax 14s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        .brand-face-kamito {
            animation: brandSlowZoomKamito 14s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* MIDOMAX: Zoom in chậm và mờ dần vào sương */
        @keyframes brandSlowZoomMidomax {
            0%, 40% {
                opacity: 1;
                filter: blur(0px);
                transform: scale(1);
            }
            48% {
                opacity: 0;
                filter: blur(8px);
                transform: scale(1.14);
                pointer-events: none;
            }
            92% {
                opacity: 0;
                filter: blur(8px);
                transform: scale(0.88);
                pointer-events: none;
            }
            98%, 100% {
                opacity: 1;
                filter: blur(0px);
                transform: scale(1);
            }
        }

        /* KAMITO RED: Zoom out chậm từ phóng to về kích thước chuẩn */
        @keyframes brandSlowZoomKamito {
            0%, 40% {
                opacity: 0;
                filter: blur(8px);
                transform: scale(1.14);
                pointer-events: none;
            }
            48% {
                opacity: 1;
                filter: blur(0px);
                transform: scale(1);
            }
            92% {
                opacity: 1;
                filter: blur(0px);
                transform: scale(1);
            }
            98%, 100% {
                opacity: 0;
                filter: blur(8px);
                transform: scale(0.88);
                pointer-events: none;
            }
        }

        .brand-midomax,
        .brand-logo-img {
            width: 100%;
            max-width: 240px;
            height: 38px;
            max-height: 42px;
            object-fit: contain;
            flex: none;
            order: 0;
            flex-grow: 0;
            display: block;
            margin: 0 auto;
        }

        /* brand.kamito/red */
        .brand-kamito,
        .brand-kamito-img {
            height: 70px;
            max-height: 75px;
            width: auto;
            max-width: 100%;
            object-fit: contain;
            display: block;
            margin: 0 auto;
            filter: none;
        }

        .brand-title-kamito {
            color: #E82020 !important;
            -webkit-text-stroke: 0.8px #E82020 !important;
        }

        .brand-title,
        .brand-logo-title {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #1b365d;
            -webkit-text-stroke: 0.8px #1b365d;
            margin: 0;
            line-height: 1;
            display: inline-flex;
            align-items: flex-start;
        }

        .reg-badge {
            font-size: 13px;
            font-weight: 800;
            color: #1e3a8a;
            margin-left: 2px;
            line-height: 1;
            transform: translateY(-2px);
        }

        .brand-subtitle {
            font-size: 13px;
            font-weight: 800;
            color: #d97706; /* MIDOMAX Signature Gold Accent */
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
            margin-bottom: 0;
        }

        .brand-line {
            width: 55px;
            height: 3.5px;
            background: linear-gradient(90deg, #dc2626, #1e3a8a);
            margin: 6px auto 0 auto;
            border-radius: 2px;
        }

        /* Input Controls */
        .form-label-custom {
            font-size: 12.5px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 6px;
            display: block;
        }

        .input-wrap {
            position: relative;
            margin-bottom: 18px;
        }

        .form-control-custom {
            width: 100%;
            background: #f8fafc;
            border: 1.5px solid #cbd5e1;
            border-radius: 14px;
            padding: 12.5px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #0f172a;
            outline: none;
            transition: all 0.25s ease;
        }

        .form-control-custom:focus {
            background: #ffffff;
            border-color: #1e3a8a;
            box-shadow: 0 0 0 4px rgba(30, 58, 138, 0.12);
        }

        .pass-eye {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            cursor: pointer;
            transition: 0.2s;
        }
        .pass-eye:hover { color: #dc2626; }

        /* ELEGANT SOFT NEON BLUE & RED SUBMIT BUTTON */
        .btn-submit-red {
            position: relative;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 40%, #be123c 75%, #f43f5e 100%) !important;
            color: #ffffff !important;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 13.5px 20px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            width: 100%;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 16px rgba(2, 132, 199, 0.25), 0 2px 8px rgba(244, 63, 94, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            z-index: 1;
            overflow: hidden;
        }

        /* Soft Subtle Glow Pseudo Element */
        .btn-submit-red::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #fb7185, #f43f5e, #38bdf8);
            background-size: 300% 300%;
            animation: neonBorderFlow 4s linear infinite;
            border-radius: 15px;
            z-index: -1;
            filter: blur(4px);
            opacity: 0.35;
            transition: opacity 0.3s ease, filter 0.3s ease;
        }

        /* Neon Shimmer Light Beam Sweep Across Button */
        .btn-submit-red::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent 40%, rgba(255, 255, 255, 0.4) 50%, transparent 60%);
            transform: translateX(-100%);
            animation: neonShimmer 4s ease-in-out infinite;
            z-index: 2;
            pointer-events: none;
        }

        .btn-submit-red:hover {
            transform: translateY(-2px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.85), 0 0 45px rgba(244, 63, 94, 0.75), inset 0 0 12px rgba(255, 255, 255, 0.6) !important;
            color: #ffffff !important;
        }

        .btn-submit-red:hover::before {
            opacity: 1;
            filter: blur(12px);
            animation-duration: 2s;
        }

        @keyframes neonBorderFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes neonShimmer {
            0% { transform: translateX(-100%) rotate(25deg); }
            35%, 100% { transform: translateX(100%) rotate(25deg); }
        }

        .btn-submit-red i {
            transition: transform 0.25s ease;
        }
        .btn-submit-red:hover i {
            transform: translateX(4px);
        }

        /* Microsoft 365 OAuth2 Button */
        .btn-ms-custom {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            color: #0284c7;
            font-weight: 700;
            font-size: 13.5px;
            padding: 11px;
            border-radius: 14px;
            text-decoration: none;
            transition: all 0.25s ease;
            margin-top: 12px;
        }

        .btn-ms-custom:hover {
            background: #f0f9ff;
            border-color: #0284c7;
            color: #0369a1;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.15);
        }
    </style>
</head>

<body>

    <!-- Ambient Glows -->
    <div class="brand-glow glow-1"></div>
    <div class="brand-glow glow-2"></div>

    <!-- Interactive Particle Background Canvas -->
    <canvas id="brandCanvas"></canvas>

    <!-- Stage Container -->
    <div class="login-stage">
        <div class="brand-card-shell">
            <!-- MIDOMAX Signature Blue & Red Extension Pills -->
            <div class="side-pill pill-r1"></div>
            <div class="side-pill pill-r2"></div>
            <div class="side-pill pill-r3"></div>
            <div class="side-pill pill-r4"></div>
            <div class="side-pill pill-l1"></div>
            <div class="side-pill pill-l2"></div>

            <!-- MAIN PRISTINE WHITE LUXURY CARD CONTAINER -->
            <div class="main-card">
                <!-- Header -->
                <div class="brand-header text-center">
                    <div class="brand-morph-container">
                        <div class="brand-face brand-face-midomax">
                            <img th:src="@{/images/logo-midomax.png}" alt="MIDOMAX" class="brand-midomax" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-flex';" />
                            <h1 class="brand-logo-title" style="display: none;">MIDOMAX</h1>
                        </div>
                        <div class="brand-face brand-face-kamito">
                            <img th:src="@{/images/kamito-logo-red.png}" alt="KAMITO" class="brand-kamito" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-flex';" />
                            <h1 class="brand-logo-title brand-title-kamito" style="display: none;">KAMITO</h1>
                        </div>
                    </div>
                    <div class="brand-subtitle">IT Portal</div>
                    <div class="brand-line mx-auto"></div>
                </div>

                <!-- Error & Logout Alerts -->
                <div th:if="${param.error}" class="alert alert-danger py-2.5 px-3 mb-3 rounded-3 small border-0 shadow-sm" role="alert">
                    <i class="fa-solid fa-circle-exclamation me-1.5"></i> Sai tên đăng nhập hoặc mật khẩu.
                </div>
                <div th:if="${param.logout}" class="alert alert-success py-2.5 px-3 mb-3 rounded-3 small border-0 shadow-sm" role="alert">
                    <i class="fa-solid fa-circle-check me-1.5"></i> Bạn đã đăng xuất thành công.
                </div>

                <!-- Login Form -->
                <form th:action="@{/login}" method="post" id="loginForm">
                    <div class="mb-3">
                        <label class="form-label-custom">Tên đăng nhập</label>
                        <div class="input-wrap">
                            <input type="text" name="username" class="form-control-custom" placeholder="Nhập tên tài khoản..." required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label-custom">Mật khẩu</label>
                        <div class="input-wrap">
                            <input type="password" name="password" id="passInput" class="form-control-custom" placeholder="Nhập mật khẩu..." required>
                            <i class="fa-solid fa-eye pass-eye" id="passIcon" onclick="togglePass()"></i>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit-red">
                        ĐĂNG NHẬP <i class="fa-solid fa-arrow-right ms-1"></i>
                    </button>
                </form>

                <div class="d-flex align-items-center my-3">
                    <hr class="flex-grow-1 text-muted opacity-25 m-0">
                    <span class="mx-3 text-muted small fw-semibold">Hoặc</span>
                    <hr class="flex-grow-1 text-muted opacity-25 m-0">
                </div>

                <!-- Microsoft 365 OAuth2 Button -->
                <a href="/oauth2/authorization/microsoft" class="btn-ms-custom">
                    <svg width="18" height="18" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
                        <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
                        <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
                        <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
                        <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
                    </svg>
                    Đăng nhập bằng Microsoft 365
                </a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePass() {
            const input = document.getElementById('passInput');
            const icon = document.getElementById('passIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        /* Interactive Particle Background Canvas */
        const canvas = document.getElementById('brandCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particles = [];
        const particleCount = 40;

        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.6,
                vy: (Math.random() - 0.5) * 0.6,
                radius: Math.random() * 2 + 1,
                alpha: Math.random() * 0.5 + 0.2
            });
        }

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw subtle grid dots
            ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
            for (let x = 0; x < canvas.width; x += 40) {
                for (let y = 0; y < canvas.height; y += 40) {
                    ctx.beginPath();
                    ctx.arc(x, y, 1, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Draw floating particles & connecting lines
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                ctx.fill();

                for (let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 125) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${0.12 * (1 - dist / 125)})`;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(drawParticles);
        }
        drawParticles();
    </script>
</body>
</html>
