<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - Midomax IT Support</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { background-color: #f1f5f9; font-family: 'Segoe UI', -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .login-card { background: white; border-radius: 14px; box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08); overflow: hidden; width: 100%; max-width: 760px; display: flex; border: 1px solid #e2e8f0; }
        .login-sidebar { background: linear-gradient(145deg, #1e3a8a, #1e40af); color: white; padding: 36px 30px; display: flex; flex-direction: column; justify-content: center; width: 44%; }
        .login-sidebar h2 { font-weight: 800; font-size: 24px; margin-bottom: 6px; letter-spacing: 0.5px; }
        .login-sidebar h4 { font-size: 15px; font-weight: 600; margin-bottom: 24px; color: #facc15; }
        .login-sidebar p { color: #e2e8f0; font-size: 13.5px; line-height: 1.5; margin-bottom: 12px; display: flex; align-items: center; }
        .login-sidebar p i { font-size: 15px; }
        .login-form-container { padding: 36px 40px; width: 56%; display: flex; flex-direction: column; justify-content: center; }
        .login-title { font-size: 21px; font-weight: 700; color: #0f172a; margin-bottom: 20px; }
        .form-label { font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 5px; }
        .form-control { border-radius: 8px; padding: 10px 12px; font-size: 14px; border: 1px solid #cbd5e1; background-color: #f8fafc; transition: all 0.2s; }
        .form-control:focus { background-color: white; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }
        .btn-login { background-color: #dc2626; color: white; font-weight: 600; font-size: 14px; padding: 10px; border-radius: 8px; border: none; width: 100%; transition: all 0.2s; }
        .btn-login:hover { background-color: #b91c1c; box-shadow: 0 4px 10px rgba(220, 38, 38, 0.25); }
        .btn-ms { border-radius: 8px; border: 1px solid #0284c7; color: #0284c7; font-weight: 600; font-size: 14px; padding: 10px; width: 100%; transition: all 0.2s; text-decoration: none; display: flex; align-items: center; justify-content: center; background: white; }
        .btn-ms:hover { background-color: #f0f9ff; color: #0369a1; border-color: #0369a1; }
        @media (max-width: 768px) { .login-sidebar { display: none; } .login-form-container { width: 100%; padding: 28px; } }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-sidebar">
        <h2>MIDOMAX</h2>
        <h4>IT Helpdesk System</h4>
        <p><i class="fa-solid fa-check-circle me-2 text-success"></i> Hỗ trợ sự cố nhanh chóng</p>
        <p><i class="fa-solid fa-check-circle me-2 text-success"></i> Quản lý yêu cầu dễ dàng</p>
        <p class="mb-0"><i class="fa-solid fa-check-circle me-2 text-success"></i> Theo dõi tiến độ xử lý 24/7</p>
    </div>
    <div class="login-form-container">
        <h3 class="login-title">Đăng nhập hệ thống</h3>
        
        <div th:if="${param.error}" class="alert alert-danger py-2 px-3 mb-3 rounded" role="alert" style="font-size: 13px;">
            <i class="fa-solid fa-circle-exclamation me-1"></i> Sai tên đăng nhập hoặc mật khẩu.
        </div>
        
        <div th:if="${param.logout}" class="alert alert-success py-2 px-3 mb-3 rounded" role="alert" style="font-size: 13px;">
            <i class="fa-solid fa-circle-check me-1"></i> Bạn đã đăng xuất thành công.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Tên đăng nhập</label>
                <input type="text" name="username" class="form-control" placeholder="Nhập tên tài khoản..." required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Mật khẩu</label>
                <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu..." required>
            </div>
            <button type="submit" class="btn-login mb-2">ĐĂNG NHẬP <i class="fa-solid fa-arrow-right ms-2"></i></button>
        </form>

        <div class="d-flex align-items-center my-2">
            <hr class="flex-grow-1 text-muted opacity-25">
            <span class="mx-2 text-muted small fw-semibold" style="font-size: 12px;">Hoặc</span>
            <hr class="flex-grow-1 text-muted opacity-25">
        </div>

        <a href="/oauth2/authorization/microsoft" class="btn-ms">
            <i class="fa-brands fa-microsoft me-2" style="color: #f25022; font-size: 16px;"></i>
            Đăng nhập bằng Microsoft 365
        </a>

        <div class="mt-3 text-center" style="font-size: 12px;">
            <span class="text-muted">Tài khoản demo: <b>user / 123</b> hoặc <b>admin / 123</b></span>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
