<div th:fragment="ticketModalFragment">
    <!-- CSS Dependencies cho Modal -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <!-- MODAL TẠO TICKET DÀNH CHO USER -->
    <div class="modal fade" id="createTicketModal" tabindex="-1" aria-labelledby="createTicketModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 16px;">
                <form action="/ticket/create" method="post" enctype="multipart/form-data">
                    <div class="modal-header border-bottom-0 bg-light"
                        style="border-radius: 16px 16px 0 0; padding: 20px 25px;">
                        <h5 class="modal-title fw-bold text-primary" id="createTicketModalLabel">
                            <i class="fa-solid fa-circle-plus me-2 text-primary"></i>Tạo Yêu Cầu Hỗ Trợ Mới
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body" style="padding: 25px;">
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label fw-bold small text-dark">Tiêu đề yêu cầu <span class="text-danger">*</span></label>
                                <input type="text" name="title" class="form-control shadow-sm" style="border-radius: 8px;" placeholder="Nhập tóm tắt sự cố (ví dụ: Lỗi không kết nối được máy in, Outlook báo lỗi...)" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold small text-dark">Họ và Tên Người gửi</label>
                                <input type="text" class="form-control bg-light text-muted shadow-sm" style="border-radius: 8px;" th:value="${username}" readonly>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold small text-dark">Phòng ban <span class="text-danger">*</span></label>
                                <select name="department" class="form-select shadow-sm" style="border-radius: 8px;" required>
                                    <option value="" selected disabled>-- Chọn phòng ban --</option>
                                    <option value="Ban Giám đốc">Ban Giám đốc</option>
                                    <option value="Ban Kiểm soát Nội bộ">Ban Kiểm soát Nội bộ</option>
                                    <option value="Bộ phận Bán buôn">Bộ phận Bán buôn</option>
                                    <option value="Bộ phận Bán lẻ">Bộ phận Bán lẻ</option>
                                    <option value="Bộ phận Ecom">Bộ phận Ecom</option>
                                    <option value="Bộ phận Marketing">Bộ phận Marketing</option>
                                    <option value="Bộ phận Graphic">Bộ phận Graphic</option>
                                    <option value="Bộ phận Content">Bộ phận Content</option>
                                    <option value="Bộ phận PAR">Bộ phận PAR</option>
                                    <option value="Bộ phận Tài chính">Bộ phận Tài chính</option>
                                    <option value="Bộ phận Kế toán">Bộ phận Kế toán</option>
                                    <option value="Bộ phận Hành chính">Bộ phận Hành chính</option>
                                    <option value="Bộ phận Nhân sự hệ thống">Bộ phận Nhân sự hệ thống</option>
                                    <option value="Bộ phận Admin System">Bộ phận Admin System</option>
                                    <option value="Bộ phận IT Helpdesk">Bộ phận IT Helpdesk</option>
                                    <option value="Bộ phận Kho vận">Bộ phận Kho vận</option>
                                    <option value="Bộ phận PD & Sourcing">Bộ phận PD & Sourcing</option>
                                    <option value="Bộ phận Thiết kế">Bộ phận Thiết kế</option>
                                    <option value="Bộ phận Category Management">Bộ phận Category Management</option>
                                    <option value="Bộ phận QA/QC">Bộ phận QA/QC</option>
                                    <option value="Bộ phận Nhà máy">Bộ phận Nhà máy</option>
                                    <option value="Phòng Kế hoạch">Phòng Kế hoạch</option>
                                    <option value="Phòng Chiến lược Ngành hàng">Phòng Chiến lược Ngành hàng</option>
                                    <option value="Khối Cung ứng">Khối Cung ứng</option>
                                    <option value="Khối Phát triển Kinh doanh">Khối Phát triển Kinh doanh</option>
                                    <option value="Khối Hỗ trợ Vận hành">Khối Hỗ trợ Vận hành</option>
                                    <option value="Khối Nhân tài Văn hóa">Khối Nhân tài Văn hóa</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold small text-dark">Danh mục sự cố <span class="text-danger">*</span></label>
                                <select name="category" class="form-select shadow-sm" style="border-radius: 8px;" required>
                                    <option value="" selected disabled>-- Chọn danh mục --</option>
                                    <option value="network">Mạng</option>
                                    <option value="hardware">Phần cứng</option>
                                    <option value="software">Phần mềm / Tài khoản</option>
                                    <option value="server">Máy chủ</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold small text-dark">Khu vực làm việc <span class="text-danger">*</span></label>
                                <select name="location" class="form-select shadow-sm" style="border-radius: 8px;" required>
                                    <option value="Hà Nội" selected>Hà Nội</option>
                                    <option value="HCM">HCM</option>
                                </select>
                            </div>

                            <div class="col-md-12">
                                <label class="form-label fw-bold small text-dark">Mô tả chi tiết lỗi <span class="text-danger">*</span></label>
                                <textarea name="description" class="form-control shadow-sm" style="border-radius: 8px;" rows="4" placeholder="Mô tả chi tiết hiện tượng lỗi, các bước dẫn đến lỗi để IT dễ dàng chẩn đoán..." required></textarea>
                            </div>

                            <div class="col-md-12">
                                <label class="form-label fw-bold small text-dark">
                                    <i class="fa-solid fa-image me-1 text-primary"></i>Đính kèm hình ảnh sự cố (Chỉ cho phép file ảnh)
                                </label>
                                <input class="form-control shadow-sm" style="border-radius: 8px;" type="file" name="imageFile" accept="image/*">
                                <div class="form-text text-muted" style="font-size: 11px;">Hỗ trợ định dạng: JPEG, PNG, GIF. Kích thước tối đa 5MB.</div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-top-0 bg-light" style="border-radius: 0 0 16px 16px; padding: 15px 25px;">
                        <button type="button" class="btn btn-secondary fw-semibold" style="border-radius: 8px;" data-bs-dismiss="modal">Hủy bỏ</button>
                        <button type="submit" class="btn btn-primary fw-bold px-4" style="background: #1e3a8a; border: none; border-radius: 8px;">
                            <i class="fa-solid fa-paper-plane me-2"></i>Gửi Yêu Cầu IT
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- JS Dependencies cho Modal -->
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const assigneeSelect = document.getElementById('create-assignee');
        if (assigneeSelect) {
            const busyContainer = document.getElementById('busy-schedule-container');
            const busyName = document.getElementById('busy-assignee-name');
            const busyList = document.getElementById('busy-schedule-list');

            function initFlatpickr(disabledRanges) {
                const dueDateInput = document.getElementById('create-duedate');
                if (dueDateInput && typeof flatpickr !== 'undefined') {
                    flatpickr(dueDateInput, {
                        dateFormat: "Y-m-d",
                        minDate: "today",
                        disable: disabledRanges || []
                    });
                }
            }

            assigneeSelect.addEventListener('change', function() {
                const assignee = this.value;
                if (!assignee) {
                    busyContainer.style.display = 'none';
                    initFlatpickr();
                    return;
                }

                busyName.textContent = this.options[this.selectedIndex].text;

                fetch('/api/tickets/schedule/' + assignee)
                    .then(response => response.json())
                    .then(schedule => {
                        let disabledRanges = [];
                        busyList.innerHTML = '';

                        if (schedule.length === 0) {
                            busyList.innerHTML = '<li>Đang hoàn toàn trống lịch.</li>';
                        } else {
                            schedule.forEach(slot => {
                                disabledRanges.push({
                                    from: slot.start,
                                    to: slot.end
                                });
                                const li = document.createElement('li');
                                li.innerHTML = `<span class="fw-bold">${slot.start} - ${slot.end}</span>: ${slot.title}`;
                                busyList.appendChild(li);
                            });
                        }

                        busyContainer.style.display = 'block';
                        initFlatpickr(disabledRanges);
                    })
                    .catch(error => console.error('Error fetching schedule:', error));
            });
        }
    });
    </script>
</div>
