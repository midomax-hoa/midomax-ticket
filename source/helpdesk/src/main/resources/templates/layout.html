<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:fragment="main-layout(content)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Helpdesk Midomax</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4f46e5;
            --bg-light: #f8fafc;
        }

        body {
            background-color: var(--bg-light);
            font-family: 'Segoe UI', sans-serif;
        }

        .sidebar {
            width: 260px;
            height: 100vh;
            position: fixed;
            background: white;
            border-right: 1px solid #e2e8f0;
            padding: 0; /* Let sidebar fragment control padding */
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .main-content {
            margin-left: 260px;
            padding: 40px;
            transition: all 0.3s ease;
        }

        .main-content.expanded {
            margin-left: 80px !important;
        }

        .nav-link {
            color: #64748b;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 5px;
            display: block;
            text-decoration: none;
        }

        .nav-link:hover,
        .nav-link.active {
            background: #eef2ff;
            color: var(--primary-color);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar" th:replace="~{fragments/sidebar :: sidebar(${activePage != null ? activePage : 'users'})}">
    </div>

    <div class="main-content" id="main-content">
        <div th:replace="${content}"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
