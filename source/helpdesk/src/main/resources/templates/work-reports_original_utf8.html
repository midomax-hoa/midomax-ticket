        body {

            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .main-content {
            margin-left: 260px;
            width: calc(100% - 260px);
            padding: 0;
            min-height: 100vh;
            background-color: #121212;
            transition: all 0.3s ease;
        }

        .main-content.expanded {
            margin-left: 80px;
            width: calc(100% - 80px);
        }

        /* TOPBAR & NAVIGATION (Notion-like) */
        .topbar {
            background: #191919;
            padding: 12px 24px;
            border-bottom: 1px solid #2d2d2d;
            display: flex;
            align-items: center;
            gap: 15px;
            color: #a3a3a3;
            font-size: 14px;
        }
        
        .topbar .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
            padding: 0;
            list-style: none;
        }
        
        .topbar .breadcrumb li {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .topbar .breadcrumb .separator {
            color: #555;
        }

        .topbar .breadcrumb .active {
            color: #fff;
            font-weight: 600;
        }

        .topbar-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .topbar-right span {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .topbar-right span:hover {
            color: #fff;
        }

        /* VIEW MENU */
        .view-menu {
            display: flex;
            align-items: center;
            padding: 10px 24px;
            border-bottom: 1px solid #2d2d2d;
            gap: 20px;
            background: #191919;
            font-size: 14px;
        }

        .view-tab {
            color: #a3a3a3;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .view-tab:hover {
            background: #2d2d2d;
            color: #fff;
        }

        .view-tab.active {
            color: #fff;
            background: #2d2d2d;
        }

        .view-tab.active::after {
            content: '';
            position: absolute;
            bottom: -11px;
            left: 0;
            width: 100%;
            height: 2px;
            background: #fff;
        }
        
        .view-tab-container {
            position: relative;
        }

            gap: 12px;

            gap: 6px;
            cursor: pointer;

            background: #2d2d2d;
            color: #fff;
        }

            border: none;
            font-weight: 500;
        }

            background: #4338ca;
        }

            margin: 0;

        .status-pill.testing { background: rgba(217, 119, 6, 0.2); color: #fbbf24; border: 1px solid rgba(217, 119, 6, 0.3); }
        .status-pill.done { background: rgba(5, 150, 105, 0.2); color: #34d399; border: 1px solid rgba(5, 150, 105, 0.3); }

            })

                    itemDiv.className = 'd-flex align-items-center justify-content-between p-2 bg-white border rounded-3';
                    itemDiv.innerHTML = `
                        <div class="d-flex align-items-center gap-2">

                            <span class="small fw-medium ${st.completed ? 'text-decoration-line-through text-muted' : ''}">${st.title}</span>
                        </div>
                        <span class="badge bg-light text-dark border small">${st.assignee || 'Assignee'}</span>
                    `;
                    subListEl.appendChild(itemDiv);
                });

                renderCommentsList(data.comments || []);

                const modalEl = document.getElementById('taskDetailModal');
                const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);

                console.error(err);
                alert('Lỗi kết nối khi tải chi tiết tác vụ!');

        function renderCommentsList(comments) {
            const feedEl = document.getElementById('detailCommentsFeed');
            if (!comments || comments.length === 0) {
                feedEl.innerHTML = '<div class="text-center py-5 text-muted small"><i class="fa-regular fa-comments fs-3 d-block mb-2"></i>Chưa có thảo luận nào. Hãy là người bắt đầu cuộc trò chuyện!</div>';
                return;
            }
            feedEl.innerHTML = '';
            comments.forEach(c => {
                const bubble = document.createElement('div');
                bubble.className = 'comment-bubble';
                const timeStr = c.createdAt ? new Date(c.createdAt).toLocaleString('vi-VN') : 'Vừa xong';

                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <strong class="text-primary small"><i class="fa-solid fa-user-circle me-1"></i>${c.author || 'Anonymous'}</strong>
                        <span class="text-muted" style="font-size: 11px;">${timeStr}</span>
                    </div>
                    <div class="small text-dark mt-1">${formattedContent}</div>
                `;
                feedEl.appendChild(bubble);
            });
            feedEl.scrollTop = feedEl.scrollHeight;
        }
