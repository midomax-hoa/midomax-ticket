e < end) {                                         isConflict = true;                                     }                                 });                                  const form = instance.element.closest('form');                                 const submitBtn = form ? form.querySelector('button[type="submit"]') : null;                                 let errEl = instance.element.parentNode.querySelector('.conflict-err');                                 if (!errEl) {                                     errEl = document.createElement('div');                                     errEl.className = 'text-danger mt-1 conflict-err fw-bold small';                                     instance.element.parentNode.appendChild(errEl);                                 }                                  if (isConflict) {                                     errEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation me-1"></i> Khung gi? ny IT d c l?ch b?n!';                                     errEl.style.display = 'block';                                     if (submitBtn) submitBtn.disabled = true;                                 } else {                                     errEl.style.display = 'none';                                     if (submitBtn) submitBtn.disabled = false;                                 }                             }                         }                     });                 }             }              modalEl.addEventListener('show.bs.modal', function () {                 const assigneeSelectAdmin = document.getElementById('assigneeSelectAdmin');                 if (assigneeSelectAdmin && assigneeSelectAdmin.tomselect) assigneeSelectAdmin.tomselect.setValue("");                 else if (assigneeSelectAdmin) assigneeSelectAdmin.value = "";                 const busyContainerAdmin = document.getElementById('busySlotsContainerAdmin');                 if (busyContainerAdmin) busyContainerAdmin.style.display = 'none';                  const assigneeSelectUser = document.getElementById('assigneeSelectUser');                 if (assigneeSelectUser && assigneeSelectUser.tomselect) assigneeSelectUser.tomselect.setValue("");                 else if (assigneeSelectUser) assigneeSelectUser.value = "";                 const busyContainerUser = document.getElementById('busySlotsContainerUser');                 if (busyContainerUser) busyContainerUser.style.display = 'none';                  initFlatpickrAdmin();                 initFlatpickrUser();             });              function setupAssigneeListener(selectId, containerId, listId, nameId, initFpFn) {                 const select = document.getElementById(selectId);                 const container = document.getElementById(containerId);                 const list = document.getElementById(listId);                 const nameEl = document.getElementById(nameId);                  if (select) {                     select.addEventListener('change', function() {                         const assignee = this.value;                         if (!assignee) {                             if (container) container.style.display = 'none';                             initFpFn();                             return;                         }                          if (nameEl) nameEl.textContent = this.options[this.selectedIndex].text;                                                  fetch('/api/tickets/schedule/' + assignee)                             .then(response => response.json())                             .then(schedule => {                                 let disabledRanges = [];                                 if (list) list.innerHTML = '';                                                                  if (schedule.length === 0) {                                     if (list) list.innerHTML = '<li>Đang hon ton trống lịch.</li>';                                 } else {                                     function formatScheduleTime(isoString) {                                         if (!isoString) return '';                                         try {                                             const d = new Date(isoString);                                             const hh = String(d.getHours()).padStart(2, '0');                                             const mm = String(d.getMinutes()).padStart(2, '0');                                             const dd = String(d.getDate()).padStart(2, '0');                                             const mo = String(d.getMonth() + 1).padStart(2, '0');                                             const yyyy = d.getFullYear();                                             return `${hh}:${mm} ${dd}/${mo}/${yyyy}`;                                         } catch(e) {                                             return isoString;                                         }                                     }                                     schedule.forEach(slot => {                                         disabledRanges.push({ from: slot.start, to: slot.end });                                         const li = document.createElement('li');                                         li.style.marginBottom = '8px';                                         li.innerHTML = `<span class="fw-bold">${formatScheduleTime(slot.start)} - ${formatScheduleTime(slot.end)}</span>: <span class="badge bg-danger bg-opacity-10 text-danger ms-1">${slot.title}</span>`;                                         if (list) list.appendChild(li);                                     });                                 }                                                                  if (container) container.style.display = 'block';                                 initFpFn(disabledRanges);                             })                             .catch(error => console.error('Error fetching schedule:', error));                     });                 }             }              setupAssigneeListener             // Exit edit mode                         toggleEditMode('row-' + ticketId, false);                     } else {                         alert('Lỗi cập nhật!');                     }                 })                 .catch(err => {                     console.error(err);                     alert('C l?i x?y ra khi k?t n?i my ch?!');                 });         }          // Hi?n  nh?p tên khác n?u ch?n option "other"         function toggleCustomRequester() {             const select = document.getElementById('requesterSelect');             const input = document.getElementById('customRequesterInput');             if (select.value === 'other') {                 input.style.display = 'block';                 input.focus();             } else {                 input.style.display = 'none';                 input.value = '';             }         }          /*[[${isAdmin != null ? isAdmin : false}]]*/ const isAdmin = /*[[${isAdmin != null ? isAdmin : false}]]*/;          function openDetailModal(ticketId) {             fetch('/ticket/detail/' + ticketId)                 .then(res => res.json())                 .then(ticket => {                     document.getElementById('detail-id').value = ticket.id;                     document.getElementById('detail-title').value = ticket.title;                     document.getElementById('detail-status').value = ticket.status.toLowerCase();                     document.getElementById('detail-priority').value = ticket.priority.toLowerCase();                     document.getElementById('detail-assignee').value = ticket.assignee ? ticket.assignee : '';                     document.getElementById('detail-category').value = ticket.category;                     document.getElementById('detail-notes').value = ticket.notes ? ticket.notes : '';

                    const fnCont = document.getElementById('detail-fixNote-container');
                    if (fnCont) fnCont.style.display = (ticket.status.toLowerCase() === 'resolved') ? 'block' : 'none';
                    const isResolved = ticket.status.toUpperCase() === 'RESOLVED';

                        statusSelect.disabled = true;
