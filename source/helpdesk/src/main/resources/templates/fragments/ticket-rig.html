<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"></head>
<body>

<!--
  Máy tính ticket + phụ kiện trên tấm giấy. Dùng chung cho admin-home và user-home.
  CSS ở /css/ticket-rig.css — trang nào dùng fragment này phải link file đó.

  rigMachine nhận 1 số cho đèn LED và 5 cặp (giá trị, nhãn):
    v1..v3 -> 3 note vàng ghim đỏ phía trên
    v4, v5 -> 2 bong bóng đỏ hai bên
  Hai trang có bộ số khác nhau (admin xem toàn hệ thống, user xem ticket của mình)
  nên nhãn được truyền vào chứ không viết cứng ở đây.
-->
<div th:fragment="rigMachine(led, v1,l1, v2,l2, v3,l3, v4,l4, v5,l5)"
     class="rig-scene" id="rig-scene">
    <div class="rig-tilt-wrapper">
        <svg class="rig-svg" viewBox="0 0 900 566" role="img"
             aria-label="Máy tính hiển thị số liệu ticket">
            <defs>
                <!-- Gradients cho Robot Chibi Kamito (như Hình 1 & Hình 2) -->
                <linearGradient id="chibiWhiteG" x1="0" y1="0" x2="0.3" y2="1">
                    <stop offset="0%" stop-color="#FFFFFF" />
                    <stop offset="50%" stop-color="#F2F6FB" />
                    <stop offset="100%" stop-color="#DDE7F2" />
                </linearGradient>
                <linearGradient id="chibiBlueG" x1="0" y1="0" x2="0.5" y2="1">
                    <stop offset="0%" stop-color="#18B2FF" />
                    <stop offset="60%" stop-color="#0088FF" />
                    <stop offset="100%" stop-color="#0055CC" />
                </linearGradient>
                <linearGradient id="screenBevelG" x1="0" y1="0" x2="0.2" y2="1">
                    <stop offset="0%" stop-color="#2D4663" />
                    <stop offset="100%" stop-color="#112030" />
                </linearGradient>
                <linearGradient id="chibiScreenG" x1="0" y1="0" x2="0.4" y2="1">
                    <stop offset="0%" stop-color="#0A223E" />
                    <stop offset="55%" stop-color="#061628" />
                    <stop offset="100%" stop-color="#020B16" />
                </linearGradient>
                <linearGradient id="glassGlossG" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#80B8FF" />
                    <stop offset="100%" stop-color="#182432" stop-opacity="0" />
                </linearGradient>
                <linearGradient id="ledG" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#0A323A" />
                    <stop offset="100%" stop-color="#04181E" />
                </linearGradient>

                <pattern id="dotPat" width="7" height="7" patternUnits="userSpaceOnUse">
                    <circle cx="1.6" cy="1.6" r="1.15" fill="#00EAFF" opacity=".16" />
                </pattern>
                <clipPath id="robotScrClip">
                    <rect x="302" y="206" width="262" height="172" rx="28" />
                </clipPath>
                <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
                    <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00EAFF" flood-opacity=".75" />
                </filter>
                <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
                    <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#102036" flood-opacity=".26" />
                </filter>
                <filter id="tinyShadow" x="-40%" y="-40%" width="180%" height="180%">
                    <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#102036" flood-opacity=".3" />
                </filter>

                <!-- VECTOR LOGO KAMITO CHUẨN HÌNH 2 (ĐẶT LÊN NGỰC ROBOT) -->
                <g id="kamito-vector-logo">
                    <!-- Nền huy hiệu đỏ bo góc sang trọng -->
                    <rect x="0" y="0" width="100" height="34" rx="7" fill="#E82020" />
                    <!-- Biểu tượng cánh chim & đầu đại bàng bên trên -->
                    <g fill="#FFFFFF" transform="translate(36, 3) scale(0.18)">
                        <!-- 3 lông cánh vuốt chéo & đầu chim -->
                        <path d="M 20 80 C 15 65 5 50 0 38 C 12 48 32 68 45 88 C 28 65 10 38 5 18 C 22 35 48 60 62 85 C 45 60 22 30 18 10 C 38 28 65 55 82 82 C 95 62 110 52 128 52 C 138 52 142 55 140 62 C 132 68 122 76 118 82 C 114 74 108 65 98 60 C 92 68 85 78 75 92 Z" />
                    </g>
                    <!-- Chữ KAMITO đậm cùng chữ A tia chớp bên dưới -->
                    <g fill="#FFFFFF" transform="translate(18, 19) scale(0.19)">
                        <!-- K -->
                        <path d="M 0 0 L 0 38 L 10 38 L 10 23 L 24 38 L 36 38 L 18 19 L 34 0 L 22 0 L 10 15 L 10 0 Z" />
                        <!-- A (Tia chớp ở giữa) -->
                        <path d="M 38 38 L 50 0 L 62 0 L 74 38 L 64 38 L 61 27 L 51 27 L 48 38 Z M 53 20 L 58 20 L 54 11 L 59 11 L 52 3 L 56 20 Z" />
                        <!-- M -->
                        <path d="M 76 38 L 76 0 L 86 0 L 93 19 L 100 0 L 110 0 L 110 38 L 101 38 L 101 11 L 95 26 L 91 26 L 85 11 L 85 38 Z" />
                        <!-- I -->
                        <path d="M 114 0 L 123 0 L 123 38 L 114 38 Z" />
                        <!-- T -->
                        <path d="M 126 0 L 148 0 L 148 8 L 141 8 L 141 38 L 133 38 L 133 8 L 126 8 Z" />
                        <!-- O -->
                        <path d="M 163 0 C 174 0 181 8 181 19 C 181 30 174 38 163 38 C 152 38 145 30 145 19 C 145 8 152 0 163 0 Z M 163 8 C 157 8 154 12 154 19 C 154 26 157 30 163 30 C 169 30 172 26 172 19 C 172 12 169 8 163 8 Z" />
                    </g>
                </g>
            </defs>

            <!-- 5 thẻ số liệu: kính mờ, không xoay, không ghim, không emoji.
                 Cùng ngôn ngữ với .sc và topbar/sidebar glass. -->

                <rect x="118" y="12" width="144" height="104" rx="14" fill="#fdf6da" stroke="#eee1b4" stroke-width="1" filter="url(#tinyShadow)" />
                <line x1="134" y1="60" x2="246" y2="60" stroke="#ece0b2" stroke-width="1.5" />

<!-- Nghiêng Robot 3D theo con trỏ chuột, Mắt linh hoạt & Tương tác nhấp chuột sinh động -->
<script th:fragment="rigScript">
    (function () {
        var scene = document.getElementById('rig-scene');
        var tilt = document.getElementById('rig-tilt');
        var speech = document.getElementById('robot-speech');
        var speechText = document.getElementById('robot-speech-text');
        if (!scene || !tilt) return;
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

        var speechMessages = [
            "✦ Xin chào! Chúc bạn làm việc vui vẻ! 🌟",
            "✦ Bạn gặp sự cố IT? Hãy tạo Ticket ngay nhé! 💻",
            "✦ Hệ thống Hỗ trợ Midomax sẵn sàng 24/7! 🤖✨",
            "✦ I ❤ KAMITO & MIDOMAX IT SUPPORT! ⚡"
        ];
        var msgIdx = 0;
        var speechTimer = null;

        function showSpeech(text, duration) {
            if (!speech || !speechText) return;
            speechText.textContent = text || speechMessages[msgIdx % speechMessages.length];
            speech.style.opacity = '1';
            speech.style.transform = 'translateY(0) scale(1)';
            clearTimeout(speechTimer);
            speechTimer = setTimeout(function () {
                speech.style.opacity = '0';
                speech.style.transform = 'translateY(10px) scale(0.9)';
            }, duration || 3500);
        }

        function handlePointerMove(e) {
            var r = scene.getBoundingClientRect();
            var isInside = e.clientX >= r.left && e.clientX <= r.right &&
                           e.clientY >= r.top && e.clientY <= r.bottom;

            if (isInside) {
                scene.classList.add('is-hovering');
            } else {
                scene.classList.remove('is-hovering');
            }

            var cx = r.left + r.width / 2;
            var cy = r.top + r.height / 2;

            // Tính toán khoảng cách chuẩn hóa (-1 đến 1) so với tâm Robot
            var dx = (e.clientX - cx) / (window.innerWidth * 0.5);
            var dy = (e.clientY - cy) / (window.innerHeight * 0.5);

            var px = Math.max(-1, Math.min(1, dx));
            var py = Math.max(-1, Math.min(1, dy));

            // Góc nghiêng 3D đa trục (Rotation Y/X/Z) & chiều sâu TranslateZ
            var ry = (px * 26).toFixed(2) + 'deg';
            var rx = (-py * 18).toFixed(2) + 'deg';
            var rz = (px * 3.5).toFixed(2) + 'deg';
            var tz = '28px';

            // Tọa độ Mắt nhìn theo con trỏ chuột (Eye Tracking)
            var eyeX = (px * 20).toFixed(1) + 'px';
            var eyeY = (py * 14).toFixed(1) + 'px';

            tilt.style.setProperty('--ry', ry);
            tilt.style.setProperty('--rx', rx);
            tilt.style.setProperty('--rz', rz);
            tilt.style.setProperty('--tz', tz);
            scene.style.setProperty('--eye-x', eyeX);
            scene.style.setProperty('--eye-y', eyeY);
        }

        function handlePointerReset() {
            scene.classList.remove('is-hovering');
            tilt.style.setProperty('--ry', '0deg');
            tilt.style.setProperty('--rx', '0deg');
            tilt.style.setProperty('--rz', '0deg');
            tilt.style.setProperty('--tz', '0px');
            scene.style.setProperty('--eye-x', '0px');
            scene.style.setProperty('--eye-y', '0px');
        }

        // Tương tác khi click vào Robot: Robot nhảy vẫy tay & hiện lời thoại 3D
        tilt.style.cursor = 'pointer';
        tilt.addEventListener('click', function (e) {
            e.stopPropagation();
            tilt.classList.remove('robot-bounce-active');
            void tilt.offsetWidth; // trigger reflow
            tilt.classList.add('robot-bounce-active');
            msgIdx++;
            showSpeech(speechMessages[msgIdx % speechMessages.length], 4000);
        });

        // Chớp mắt tự nhiên định kỳ mỗi 4 giây
        setInterval(function () {
            var eyes = scene.querySelectorAll('.eye-track');
            eyes.forEach(function (eye) {
                eye.classList.add('robot-eye-blink');
                setTimeout(function () { eye.classList.remove('robot-eye-blink'); }, 180);
            });
        }, 4200);

        // Tương tác rê chuột toàn màn hình & trong khu vực Robot
        window.addEventListener('pointermove', handlePointerMove);
        window.addEventListener('pointerleave', handlePointerReset);
        scene.addEventListener('pointerleave', handlePointerReset);
    })();
</script>

</body>
</html>
