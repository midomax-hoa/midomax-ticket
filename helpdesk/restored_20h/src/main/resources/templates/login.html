<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - Midomax IT Support</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: white; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); overflow: hidden; width: 100%; max-width: 900px; display: flex; border: none; }
        .login-sidebar { background-color: #1e3a8a; color: white; padding: 40px; display: flex; flex-direction: column; justify-content: center; width: 45%; }
        .login-sidebar h2 { font-weight: 800; font-size: 28px; margin-bottom: 15px; }
        .login-sidebar p { color: #cbd5e1; font-size: 15px; line-height: 1.6; }
        .login-form-container { padding: 50px; width: 55%; display: flex; flex-direction: column; justify-content: center; }
        .login-title { font-size: 24px; font-weight: bold; color: #1e293b; margin-bottom: 30px; }
        .form-control { border-radius: 8px; padding: 12px; border: 1px solid #e2e8f0; background-color: #f1f5f9; transition: 0.3s; }
        .form-control:focus { background-color: white; border-color: #1e3a8a; box-shadow: 0 0 0 4
        <p><i class="fa-solid fa-check-circle me-2 text-success"></i> Quản lý yêu cầu dễ dàng</p>
        <p><i class="fa-solid fa-check-circle me-2 text-success"></i> Theo dõi tiến độ xử lý 24/7</p>
    </div>
    <div class="login-form-container">
        <h3 class="login-title">Đăng nhập hệ thống</h3>
        
        <div th:if="${param.error}" class="alert alert-danger p-2 mb-3 rounded" role="alert">
            <small>Sai tên đăng nhập hoặc mật khẩu.</small>
        </div>
        
        <div th:if="${param.logout}" class="alert alert-success p-2 mb-3 rounded" role="alert">
            <small>Bạn đã đăng xuất thành công.</small>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label text-muted fw-semibold small">Tên đăng nhập</label>
                <input type="text" name="username" class="form-control" placeholder="Nhập tên tài khoản..." required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label text-muted fw-semibold small">Mật khẩu</label>
                <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu..." required>
            </div>
            <button type="submit" class="btn-login">ĐĂNG NHẬP <i class="fa-solid fa-arrow-right ms-2"></i></button>
        </form>
        <div class="mt-4 text-center">
            <small class="text-muted">Tài khoản demo:<br> User: <b>user / 123</b> <br> Admin: <b>admin / 123</b></small>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
