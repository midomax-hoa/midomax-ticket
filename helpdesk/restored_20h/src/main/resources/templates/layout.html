<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:fragment="main-layout(content)">

<head>
    <meta charset="UTF-8">
    <title>IT Helpdesk Midomax</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4f46e5;
            --bg-light: #f8fafc;
        }

        body {
            background-color: var(--bg-light);
            font-family: 'Segoe UI', sans-serif;
        }

        .sidebar {
            width: 260px;
            height: 100vh;
            position: fixed;
            background: white;
            border-right: 1px solid #e2e8f0;
            padding: 20px;
            z-index: 1000;
        }

        .main-content {
            margin-left: 260px;
            padding: 40px;
        }

        .nav-link {
            color: #64748b;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 5px;
            display: block;
            text-decoration: none;
        }

        .nav-link:hover,
        .nav-link.active {
            background: #eef2ff;
            color: var(--p
                <div class="d-flex align-items-center">
                    <div class="text-white d-flex align-items-center justify-content-center fw-bold"
                        style="background-color: #3b82f6; width: 45px; height: 45px; font-size: 18px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);">
                        <span sec:authorize="hasRole('ADMIN')">IT</span>
                        <span sec:authorize="hasRole('USER')">US</span>
                    </div>
                    <div class="ms-3 lh-sm">
                        <div class="fw-bold mb-1" style="color: #1e3a8a; font-size: 16px; text-transform: capitalize;"
                            sec:authentication="name">Super Admin</div>
                        <small class="text-muted fw-semibold" style="font-size: 13px;"
                            sec:authorize="hasRole('ADMIN')">Quản trị viên</small>
                        <small class="text-muted fw-semibold" style="font-size: 13px;"
                            sec:authorize="hasRole('USER')">Nhân viên</small>
                    </div>
                </div>
                <button type="submit" class="btn btn-link p-0 border-0"
                    style="color: #94a3b8; font-size: 20px; transition: 0.2s;" onmouseover="this.style.color='#e1251b'"
                    onmouseout="this.style.color='#94a3b8'" title="Đăng xuất">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </form>
        </div>
    </div>

    <div class="main-content">
        <div th:replace="${content}"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
