# Charset configuration
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# Upload biên bản giao nhận / thu hồi tài sản
# Ảnh chụp từ điện thoại thường 3-8 MB, mặc định Spring chỉ cho 1 MB nên phải nới ra.
# Cho phép chụp nhiều tờ một lần nên giới hạn cả request cũng phải lớn hơn.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=80MB

# Nơi lưu ảnh biên bản. KHÔNG để trong target/ hay src/ vì "mvn clean" sẽ xoá mất.
# Đổi sang ổ khác hoặc thư mục có backup thì sửa dòng này.
app.asset-doc-dir=data/asset-docs

# Tự động tải dữ liệu chấm công từ máy chấm công.
# 12h trưa lấy chấm công sáng; 12h khuya lấy chấm công chiều và chốt ngày vừa qua.
# Đặt enabled=false để tắt, quay về bấm nút tay.
attendance.auto-sync.enabled=true
attendance.auto-sync.noon-cron=0 0 12 * * *
attendance.auto-sync.midnight-cron=0 0 0 * * *

# Địa chỉ gốc của hệ thống — dùng cho link trong email gửi ra ngoài.
# Trước đây link ghi cứng localhost:8080 nên người nhận bấm vào mở máy của chính họ.
app.base-url=https://ticket.midomax.vn
